<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081725">
<title>PowerPoints · Science Vault Resource Hub</title>
<link rel="stylesheet" href="style.css?v=collection-filters-2">
<script type="module" src="app.js?v=catalogue-refresh-1"></script>
<style>
.directory-view{border:1px solid #cbd5e1;border-radius:14px;overflow:hidden;background:#fff;color:#172638}
.directory-crumbs{padding:14px 18px;background:#edf4f9;border-bottom:1px solid #cbd5e1;display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.directory-crumbs button{border:0;background:transparent;color:#135b91;cursor:pointer;font:inherit;padding:3px}
.directory-summary{margin:0;padding:14px 18px;color:#475569;border-bottom:1px solid #e2e8f0}
.directory-entry{width:100%;display:flex;align-items:center;text-align:left;gap:14px;padding:13px 18px;border:0;border-bottom:1px solid #e2e8f0;background:#fff;color:#172638;font:inherit;cursor:pointer}
.directory-entry:hover,.directory-entry:focus-visible{background:#edf6ff}
.directory-entry small{margin-left:auto;color:#64748b;white-space:nowrap}
.directory-symbol{font-size:1.4em}
@media(max-width:600px){.directory-entry{gap:8px;padding:12px}.directory-entry small{font-size:.75em}}
</style>
<style>
/* Compact expandable file tree, modelled on the provided directory reference. */
.ppt-tree{background:#fff;color:#122637;border-radius:12px;overflow:hidden;padding:16px 10px 22px}
.ppt-tree-heading{display:flex;align-items:baseline;gap:15px;padding:0 12px 12px}
.ppt-tree-heading strong{font-size:1.55rem;color:#122637}
.ppt-tree-count{font-size:.85rem;color:#4e6274}
.ppt-tree-content{overflow-x:auto}
.ppt-tree-line{--tree-depth:0;display:flex;align-items:center;gap:10px;min-height:30px;padding:2px 12px 2px calc(12px + var(--tree-depth)*23px);font-size:.94rem;white-space:nowrap}
.ppt-tree-line:hover{background:#edf3f7}
.ppt-tree-toggle{min-height:26px;display:inline-flex;align-items:center;gap:8px;padding:1px 4px;background:transparent;border:0;color:#006b64;font-weight:400;text-align:left;border-radius:3px}
.ppt-tree-toggle:hover{background:#eaf8f5;color:#005a54}
.ppt-tree-chevron{width:12px;color:#4e6274}
.ppt-tree-folder{font-size:1rem}
.ppt-tree-name{font-size:.94rem}
.ppt-tree-file-icon{margin-left:19px;font-size:.95rem}
.ppt-tree-filename{color:#006b64;overflow-wrap:anywhere;white-space:normal}
.ppt-tree-action{min-height:25px;padding:2px 10px;background:#006b64;border:0;border-radius:3px;color:white;font-size:.78rem;font-weight:600}
.ppt-tree-action:hover{background:#00534e;color:#fff}
.ppt-tree-download{font-size:1.35rem;line-height:1;color:#006b64;text-decoration:none;padding:0 5px}
.ppt-tree-download:hover{color:#004e48}
.ppt-tree-empty{padding:10px 16px;color:#4e6274}
.ppt-tree-children[hidden]{display:none}
@media(max-width:600px){.ppt-tree{padding:12px 4px}.ppt-tree-line{gap:6px}.ppt-tree-action{font-size:.72rem}}
</style>
<style>
/* Full-width PowerPoints directory mode: preserve normal page width for Grid View. */
body:has(#viewMode option[value="directory"]:checked) main.wrap{width:calc(100% - 32px);max-width:none}
body:has(#viewMode option[value="directory"]:checked) #catalogue{width:100%;max-width:none}
body:has(#viewMode option[value="directory"]:checked) #results{width:100%;max-width:none;display:block}
body:has(#viewMode option[value="directory"]:checked) .ppt-tree{width:100%;max-width:none}
@media(max-width:720px){body:has(#viewMode option[value="directory"]:checked) main.wrap{width:calc(100% - 16px)}}
</style>
</head>
<body data-collection="powerpoints">
<a class="skip" href="#query">Skip to search</a>
<header class="topbar"><div class="wrap topbar-inner">
<a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✳</span><span>Science Vault</span></a>
<nav class="top-nav" aria-label="Main navigation"><a class="top-link" href="#catalogue">Resource catalogue</a><a class="top-link" href="./#assessment-builders">Assessment builders</a></nav>
</div></header>
<main class="wrap">
<section class="intro">
  <div class="intro-copy">
    <p class="eyebrow">Resource Hub</p>
    <h1>PowerPoints</h1>
    <p class="intro-description">Search lesson presentations by learning area, subject, year level or topic.</p>
    <div class="search-box">
      <span class="search-icon" aria-hidden="true"></span>
      <input aria-label="Search resources" id="query" type="search" placeholder="Search by title, topic or keyword">
      <kbd aria-hidden="true">/</kbd>
    </div>
  </div>
  <div class="orbit" aria-hidden="true"><div class="orbit-ring outer"></div><div class="orbit-ring middle"></div><div class="orbit-ring inner"></div><div class="orbit-core"></div><i></i><i></i><i></i><i></i></div>
</section>
<nav id="collections" aria-label="Resource collections"></nav>
<section class="catalogue" id="catalogue" aria-labelledby="catalogue-title">
<div class="catalogue-head"><h2 id="catalogue-title">PowerPoints catalogue</h2><div class="catalogue-options"><label class="sort">View <select id="viewMode" aria-label="PowerPoints display mode"><option value="grid">Grid view</option><option value="directory">Directory view</option></select></label><label class="sort">Sort by <select id="sort"><option value="title">Title A–Z</option><option value="newest">Recently added</option><option value="year">Year level</option></select></label><label class="sort">Resources per page <select id="pageSize"><option>20</option><option selected>40</option><option>60</option><option>100</option></select></label></div></div>
<div class="filters">
<label>Learning area<select id="area" data-all="All learning areas"><option value="">All learning areas</option></select></label>
<label>Subject<select id="subject" data-all="All subjects"><option value="">All subjects</option></select></label>
<label>Year level<select id="year" data-all="All year levels"><option value="">All year levels</option></select></label>
<label>Topic<select id="topic" data-all="All topics"><option value="">All topics</option></select></label>
<label>File format<select id="format" data-all="All file formats"><option value="">All file formats</option></select></label>
<button id="clear" type="button">Clear filters</button>
</div>
<div class="results-bar"><p id="status" role="status">Loading catalogue…</p></div>
<div id="results"></div>
<nav id="pages" aria-label="Results pages"></nav>
</section>
<footer><p>Original collections</p><div id="sources"></div></footer>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><form method="dialog"><button aria-label="Close preview">Close</button></form></div><p id="detail-meta"></p><div id="actions"></div><div id="preview"></div><section id="related-files" hidden></section></dialog>
</body>
</html>
