<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081725">
<title>Videos · Science Vault Resource Hub</title>
<link rel="stylesheet" href="style.css?v=collection-filters-2">
<script type="module" src="app.js?v=collection-filters-2"></script>
</head>
<body data-collection="videos">
<a class="skip" href="#query">Skip to search</a>
<header class="topbar"><div class="wrap topbar-inner">
<a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✳</span><span>Science Vault</span></a>
<nav class="top-nav" aria-label="Main navigation"><a class="top-link" href="#catalogue">Resource catalogue</a><a class="top-link" href="./#assessment-builders">Assessment builders</a></nav>
</div></header>
<main class="wrap">
<section class="intro">
  <div class="intro-copy">
    <p class="eyebrow">Resource Hub</p>
    <h1>Videos</h1>
    <p class="intro-description">Browse the videos catalogue.</p>
    <div class="search-box">
      <span class="search-icon" aria-hidden="true"></span>
      <input aria-label="Search resources" id="query" type="search" placeholder="Search by title, topic or keyword">
      <kbd aria-hidden="true">/</kbd>
    </div>
  </div>
  <div class="orbit" aria-hidden="true"><div class="orbit-ring outer"></div><div class="orbit-ring middle"></div><div class="orbit-ring inner"></div><div class="orbit-core"></div><i></i><i></i><i></i><i></i></div>
</section>
<nav id="collections" aria-label="Resource collections"></nav>
<section class="catalogue" id="catalogue" aria-labelledby="catalogue-title">
<div class="catalogue-head"><h2 id="catalogue-title">Videos catalogue</h2><div class="catalogue-options"><label class="sort">Sort by <select id="sort"><option value="title">Title A–Z</option><option value="newest">Recently added</option><option value="year">Year level</option></select></label><label class="sort">Resources per page <select id="pageSize"><option>20</option><option selected>40</option><option>60</option><option>100</option></select></label></div></div>
<div class="filters">
<label>Learning area<select id="area" data-all="All learning areas"><option value="">All learning areas</option></select></label>
<label>Subject<select id="subject" data-all="All subjects"><option value="">All subjects</option></select></label>
<label>Year level<select id="year" data-all="All year levels"><option value="">All year levels</option></select></label>
<label>Pathway<select id="pathway" data-all="All pathways"><option value="">All pathways</option></select></label>
<label>Unit<select id="unit" data-all="All units"><option value="">All units</option></select></label>
<label>Strand<select id="strand" data-all="All strands"><option value="">All strands</option></select></label>
<label>Topic<select id="topic" data-all="All topics"><option value="">All topics</option></select></label>
<label>Resource type<select id="format" data-all="All resource types"><option value="">All resource types</option></select></label>
<button id="clear" type="button">Clear filters</button>
</div>
<div class="results-bar"><p id="status" role="status">Loading catalogue…</p></div>
<div id="results"></div>
<nav id="pages" aria-label="Results pages"></nav>
</section>
<footer><p>Original collections</p><div id="sources"></div></footer>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><form method="dialog"><button aria-label="Close preview">Close</button></form></div><p id="detail-meta"></p><div id="actions"></div><div id="preview"></div><section id="related-files" hidden></section></dialog>
</body>
</html>
